<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 56" width="1200" height="56" role="img" aria-label="ReweCoin circuit divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ReweCoin circuit divider</title>
  <defs>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#c9a24a" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#c9a24a" stop-opacity="0.75"/>
      <stop offset="0.88" stop-color="#c9a24a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c9a24a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .trace { fill: none; stroke: #c9a24a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }
      .node  { fill: #0b1220; stroke: #c9a24a; stroke-width: 1.6; }
      .pulse { fill: none; stroke-width: 3; stroke-linecap: round; }
      .pg { stroke: #00c853; stroke-dasharray: 90 1110; stroke-dashoffset: 1200; animation: flowR 12s linear infinite; }
      .pb { stroke: #7dc0ff; stroke-dasharray: 90 1110; stroke-dashoffset: 0;    animation: flowL 14s linear infinite; }
      .bg { stroke: #00c853; stroke-dasharray: 36 164; stroke-dashoffset: 200; animation: flowS 10s linear infinite; }
      .bb { stroke: #5b9bd5; stroke-dasharray: 36 164; stroke-dashoffset: 0;   animation: flowT 11s linear infinite; }
      @keyframes flowR { from { stroke-dashoffset: 1200; } to { stroke-dashoffset: 0; } }
      @keyframes flowL { from { stroke-dashoffset: 0; }    to { stroke-dashoffset: 1200; } }
      @keyframes flowS { from { stroke-dashoffset: 200; }  to { stroke-dashoffset: 0; } }
      @keyframes flowT { from { stroke-dashoffset: 0; }    to { stroke-dashoffset: 200; } }
    </style>
  </defs>

  <!-- main line -->
  <path d="M0 28 H1200" stroke="url(#fade)" stroke-width="2" fill="none"/>

  <!-- left branches -->
  <path class="trace" d="M150 28 V12 H210"/>
  <path class="trace" d="M260 28 V44 H330"/>
  <path class="trace" d="M400 28 V16 H450 V8 H500"/>
  <!-- right branches (mirrored) -->
  <path class="trace" d="M1050 28 V12 H990"/>
  <path class="trace" d="M940 28 V44 H870"/>
  <path class="trace" d="M800 28 V16 H750 V8 H700"/>

  <!-- nodes -->
  <circle class="node" cx="210" cy="12" r="3.4"/>
  <circle class="node" cx="330" cy="44" r="3.4"/>
  <circle class="node" cx="500" cy="8"  r="3.4"/>
  <circle class="node" cx="990" cy="12" r="3.4"/>
  <circle class="node" cx="870" cy="44" r="3.4"/>
  <circle class="node" cx="700" cy="8"  r="3.4"/>

  <!-- center hub -->
  <g transform="translate(600 28)">
    <rect x="-9" y="-9" width="18" height="18" rx="3" transform="rotate(45)" fill="#0b1220" stroke="#c9a24a" stroke-width="1.8"/>
    <circle r="3" fill="#5b9bd5" filter="url(#glow)"/>
  </g>

  <!-- energy flowing along the main line -->
  <g filter="url(#glow)">
    <path class="pulse pg" d="M0 28 H1200" pathLength="1200"/>
    <path class="pulse pb" d="M0 28 H1200" pathLength="1200"/>
  </g>

  <!-- energy along two branches -->
  <g filter="url(#glow)">
    <path class="pulse bg" d="M150 28 V12 H210" pathLength="200" style="stroke-width:2.4"/>
    <path class="pulse bb" d="M1050 28 V12 H990" pathLength="200" style="stroke-width:2.4"/>
  </g>
</svg>
