  .fa{animation:fl 12s linear infinite}.fb{animation:fl 14s linear infinite reverse}
  .fc{animation:fl 10s linear infinite}.fd{animation:fl 11s linear infinite reverse}
  .d1{animation-delay:-3s}.d2{animation-delay:-6s}.d3{animation-delay:-9s}.d4{animation-delay:-1.5s}
