<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="ReweCoin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140303"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset=".5" stop-color="#FFE566"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e10600" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd7b0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e10600" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="letters">
      <text class="t" x="500" y="138" text-anchor="middle" font-size="86">REWECOIN</text>
    </clipPath>
    <style>
      .t{font-family:Cambria,Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:10px}
      .s{font-family:Consolas,'Courier New',monospace;letter-spacing:4px}
      .d{font-family:Consolas,'Courier New',monospace;font-size:9px;font-weight:700;animation-name:flow;animation-timing-function:linear;animation-iteration-count:infinite}
      @keyframes flow{from{transform:translateX(0)}to{transform:translateX(-100px)}}
      .sw{animation:sw 5s ease-in-out infinite}
      @keyframes sw{from{transform:translateX(-260px)}to{transform:translateX(1000px)}}
      .run{stroke-dasharray:60 940;animation:run 4s linear infinite}
      @keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
      .led{animation:blink 2.6s infinite}
      @keyframes blink{0%,86%,100%{opacity:1}92%{opacity:.2}}
      @media (prefers-reduced-motion:reduce){.d,.sw,.run,.led{animation:none}}
    </style>
  </defs>

  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>

  <path d="M14 34 34 14H966L986 34V246L966 266H34L14 246Z" fill="none" stroke="#e10600" stroke-width="2"/>
  <path class="run" pathLength="1000" d="M14 34 34 14H966L986 34V246L966 266H34L14 246Z" fill="none" stroke="#ff3b3b" stroke-width="2.5" filter="url(#glow)"/>

  <g fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-opacity=".85">
    <path d="M986 70H890L868 92H780L758 114H700"/>
    <path d="M986 100H930L912 118"/>
    <path d="M14 210H110L132 188H220L242 166H300"/>
    <path d="M14 180H70L90 160"/>
    <path d="M986 200H900L880 220H800"/>
    <path d="M14 70H100L120 90H190"/>
  </g>
  <g fill="#1a0000" stroke="#FFD700" stroke-width="1.4">
    <circle cx="700" cy="114" r="3.5"/><circle cx="912" cy="118" r="3"/>
    <circle cx="300" cy="166" r="3.5"/><circle cx="90" cy="160" r="3"/>
    <circle cx="800" cy="220" r="3"/><circle cx="190" cy="90" r="3"/>
  </g>

  <text class="t" x="500" y="138" text-anchor="middle" font-size="86" fill="#0a0000" stroke="#e10600" stroke-width="2" filter="url(#glow)">REWECOIN</text>
  <g clip-path="url(#letters)">
    <text class="d" style="animation-duration:2.20s;animation-direction:normal" x="140" y="84" textLength="1400" lengthAdjust="spacing" fill="#ff3b3b">01101001010110100101011010010101101001010110100101011010010101101001010110100101011010010101101001010110100101011010010101101001010110100101</text>
    <text class="d" style="animation-duration:2.55s;animation-direction:reverse" x="140" y="93" textLength="1400" lengthAdjust="spacing" fill="#e10600">10010110101001011010100101101010010110101001011010100101101010010110101001011010100101101010010110101001011010100101101010010110101001011010</text>
    <text class="d" style="animation-duration:2.90s;animation-direction:normal" x="140" y="102" textLength="1400" lengthAdjust="spacing" fill="#ffd700">01011100010101110001010111000101011100010101110001010111000101011100010101110001010111000101011100010101110001010111000101011100010101110001</text>
    <text class="d" style="animation-duration:3.25s;animation-direction:reverse" x="140" y="111" textLength="1400" lengthAdjust="spacing" fill="#e10600">11100010111110001011111000101111100010111110001011111000101111100010111110001011111000101111100010111110001011111000101111100010111110001011</text>
    <text class="d" style="animation-duration:3.60s;animation-direction:normal" x="140" y="120" textLength="1400" lengthAdjust="spacing" fill="#ff3b3b">00101110100010111010001011101000101110100010111010001011101000101110100010111010001011101000101110100010111010001011101000101110100010111010</text>
    <text class="d" style="animation-duration:3.95s;animation-direction:reverse" x="140" y="129" textLength="1400" lengthAdjust="spacing" fill="#ffd700">10110001101011000110101100011010110001101011000110101100011010110001101011000110101100011010110001101011000110101100011010110001101011000110</text>
    <text class="d" style="animation-duration:4.30s;animation-direction:normal" x="140" y="138" textLength="1400" lengthAdjust="spacing" fill="#e10600">01001101110100110111010011011101001101110100110111010011011101001101110100110111010011011101001101110100110111010011011101001101110100110111</text>
    <rect class="sw" x="0" y="70" width="260" height="76" fill="url(#sweep)" transform="skewX(-20)"/>
  </g>
  <text class="t" x="500" y="138" text-anchor="middle" font-size="86" fill="none" stroke="#FFD700" stroke-width=".8" stroke-opacity=".7">REWECOIN</text>

  <rect x="250" y="164" width="500" height="2" fill="url(#line)"/>
  <text class="s" x="500" y="200" text-anchor="middle" font-size="17" fill="#FFD700">INDEPENDENT EQUIHASH BLOCKCHAIN</text>
  <text class="s" x="500" y="228" text-anchor="middle" font-size="13" fill="#ff3b3b" opacity=".9">WALLET  ·  EXPLORER  ·  MINING POOL</text>

  <circle class="led" cx="960" cy="34" r="3.5" fill="#ff3b3b" filter="url(#glow)"/>
  <circle class="led" cx="946" cy="34" r="3.5" fill="#FFD700" filter="url(#glow)"/>
</svg>
