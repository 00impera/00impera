<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="WALLET">
<style>
.run{stroke-dasharray:14 86;animation:r 2.4s linear infinite;animation-delay:-0.6s}
.sh{animation:s 3.6s ease-in-out infinite;animation-delay:-0.6s}
@keyframes r{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes s{0%{transform:translateX(-90px)}60%,100%{transform:translateX(300px)}}
@media (prefers-reduced-motion:reduce){.run,.sh{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1c12"/><stop offset=".5" stop-color="#050A0E"/><stop offset="1" stop-color="#0c1a0c"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B8860B"/><stop offset=".5" stop-color="#FFE566"/><stop offset="1" stop-color="#B8860B"/></linearGradient>
<linearGradient id="shn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><path d="M12,2 H188 L198,12 V36 L188,46 H12 L2,36 V12 Z"/></clipPath>
<filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<path d="M12,2 H188 L198,12 V36 L188,46 H12 L2,36 V12 Z" fill="url(#bg)" stroke="url(#gold)" stroke-width="2"/>
<path d="M14,6 H186 L194,14 V34 L186,42 H14 L6,34 V14 Z" fill="none" stroke="#00CC00" stroke-opacity=".35" stroke-width="1"/>
<g clip-path="url(#c)"><g class="sh"><rect x="0" y="-4" width="30" height="56" fill="url(#shn)" transform="skewX(-20)"/></g></g>
<path class="run" pathLength="100" d="M12,2 H188 L198,12 V36 L188,46 H12 L2,36 V12 Z" fill="none" stroke="#39FF14" stroke-width="5" filter="url(#gl)"/>
<path class="run" pathLength="100" d="M12,2 H188 L198,12 V36 L188,46 H12 L2,36 V12 Z" fill="none" stroke="#D8FFCC" stroke-width="2"/>
<circle cx="9" cy="24" r="1.6" fill="#FFD700"/><circle cx="191" cy="24" r="1.6" fill="#FFD700"/>
<text x="100" y="30" text-anchor="middle" font-family="Consolas,'Cascadia Mono','Courier New',monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#FFD700">WALLET</text>
